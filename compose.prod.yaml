services:
  bot:
    environment:
      MINI_APP_URL: https://${GAME_DOMAIN:?Set GAME_DOMAIN in .env}

  game:
    build:
      context: ./game-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - game
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
